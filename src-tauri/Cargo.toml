[package]
name = "argus-desktop"
description = "Argus: IDE desktop para vários projetos com agentes de IA"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argus-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Só a ponte de validação usa (servidor de teste em 127.0.0.1, ver `ponte.rs`).
axum = "0.8"
base64 = "0.23.1"
sysinfo = "0.40.3"
rodio = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
tempfile = "3"
