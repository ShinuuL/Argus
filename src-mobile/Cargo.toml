[package]
name = "argus-celular"
description = "Argus Celular: aplicativo Android que abre as conversas do Argus no computador"
version = "0.1.2"
edition = "2021"

# Fora do workspace (ver `exclude` no Cargo.toml da raiz): o aplicativo do celular
# é compilado para Android pelo `cargo tauri android`, com outro alvo e outro SDK.

[lib]
name = "argus_celular_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O APK leva a biblioteca nativa das quatro arquiteturas do Android. Com os
# símbolos de depuração o arquivo passava de 460 MB; sem eles fica na casa das
# dezenas. O que se perde é a pilha simbolizada de um crash nativo — e o
# aplicativo aqui é uma casca fina em volta da webview.
[profile.dev]
strip = "debuginfo"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
