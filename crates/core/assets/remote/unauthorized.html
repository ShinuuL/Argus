<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex">
<title>Argus: não autorizado</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:#0d1b2a;color:#e0e1dd;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;text-align:center}
svg{color:#ff8f7a}
h1{margin:14px 0 8px;font-size:22px;font-weight:650}
p{margin:0 0 14px;color:#a4b5c8}
ol{margin:0;padding:16px 16px 16px 38px;text-align:left;background:#1b263b;border:1px solid #2e405a;border-radius:12px}
li{margin:6px 0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid #ff8f7a;border-radius:12px;color:#ff8f7a;font-size:13px;font-weight:600}
</style>
</head>
<body>
<main role="alert">
  <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
  <div><span class="tag">Erro 401</span></div>
  <h1>Não autorizado</h1>
  <p>Este aparelho não está pareado, ou o acesso foi revogado.</p>
  <ol>
    <li>No computador, abra o Argus e vá em <b>Remoto</b>.</li>
    <li>Confira se o servidor está ligado.</li>
    <li>Leia o QR code com a câmera deste aparelho.</li>
  </ol>
</main>
</body>
</html>
