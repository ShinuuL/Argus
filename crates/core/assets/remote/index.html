<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Argus Remoto</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Voltar">&#8592;</button>
  <h1 id="title">Sessões</h1>
  <span id="conn" class="dot" title="Conexão"></span>
</header>
<main>
  <section id="list-view">
    <ul id="tasks"></ul>
    <details id="servers">
      <summary>Servidores <span id="srv-count"></span></summary>
      <ul id="srv-list"></ul>
    </details>
    <details id="new">
      <summary>Nova tarefa</summary>
      <form id="new-form">
        <label>Projeto<input id="nf-project" list="projects" required></label>
        <datalist id="projects"></datalist>
        <label>Agente<select id="nf-provider"><option>claude</option><option>opencode</option></select></label>
        <label>Pedido<textarea id="nf-prompt" rows="3" required></textarea></label>
        <button type="submit">Enviar</button>
      </form>
    </details>
  </section>
  <section id="chat-view" hidden>
    <div id="meta"></div>
    <div id="aw" class="aw">
      <label class="aw-toggle"><input type="checkbox" id="aw-enabled"> Auto-work no projeto</label>
      <span id="aw-status" class="aw-pill"></span>
      <span id="aw-item" class="aw-item"></span>
      <span class="aw-btns"><button type="button" id="aw-pause">Pausar</button><button type="button" id="aw-resume">Retomar</button><button type="button" id="aw-start">Iniciar</button><button type="button" id="aw-stop" class="danger">Parar auto-work</button></span>
    </div>
    <div id="log"></div>
  </section>
</main>
<form id="reply" hidden>
  <textarea id="msg" rows="1" placeholder="Responder..."></textarea>
  <button type="submit">Enviar</button>
  <button type="button" id="cancel" class="danger">Parar</button>
</form>
<script src="/app.js"></script>
</body>
</html>
