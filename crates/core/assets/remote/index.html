<!doctype html>
<html lang="pt-BR" data-theme="oceano">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="theme-color" content="#0d1b2a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argus">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Argus</title>
<link rel="manifest" id="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" id="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<!-- Sem "defer" de propósito: as primeiras linhas aplicam o tema antes da primeira pintura. -->
<script src="/app.js"></script>
</head>
<body>
<div id="app">
  <div id="conn" class="conn" role="status" aria-live="polite" hidden></div>
  <header id="top"></header>
  <main id="view" tabindex="-1"></main>
  <footer id="foot"></footer>
  <nav id="tabs" aria-label="Telas"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden></div>
<noscript><p class="noscript">O Argus pelo celular precisa de JavaScript ligado no navegador.</p></noscript>
</body>
</html>
