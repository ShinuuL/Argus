[package]
name = "argus-app"
version.workspace = true
edition.workspace = true

[dependencies]
argus-core = { path = "../core" }
dioxus = { version = "0.7", features = ["desktop"] }
rfd = "0.15"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rodio = "0.20"
sysinfo = "0.40.3"
base64 = "0.23.1"
futures = "0.3.34"
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections"] }
